  <body>
    <main class="legal-main">
      <section class="legal-card">
        <p class="eyebrow">Herramienta referencial</p>
        <h1>Calculadora interna de precios</h1>
        <p class="notice">Esta herramienta es referencial y no reemplaza asesoria contable.</p>
        <form class="claim-form" id="priceCalc">
          <label>Precio base soles sin IGV <input type="number" step="0.01" id="penBase" value="100"></label>
          <label>Aplicar IGV 18% <select id="applyIgv"><option value="1">Si</option><option value="0">No</option></select></label>
          <label>Precio base USD <input type="number" step="0.01" id="usdBase" value="30"></label>
          <label>Comision PayPal % <input type="number" step="0.001" id="paypalPct" value="0.054"></label>
          <label>Comision fija PayPal <input type="number" step="0.01" id="paypalFixed" value="0.30"></label>
          <label>Comision bancaria % <input type="number" step="0.001" id="bankPct" value="0"></label>
          <label>Comision bancaria fija USD <input type="number" step="0.01" id="bankFixed" value="0"></label>
        </form>
        <article class="detail-block">
          <h2>Resultados</h2>
          <p id="calcOut"></p>
        </article>
      </section>
    </main>
    <script>
      const form = document.getElementById("priceCalc");
      const out = document.getElementById("calcOut");
      function n(id){ return Number(document.getElementById(id).value || 0); }
      function calc(){
        const penFinal = n("penBase") * (document.getElementById("applyIgv").value === "1" ? 1.18 : 1);
        const net = n("usdBase");
        const gross = (net + n("paypalFixed") + n("bankFixed")) / Math.max(0.01, 1 - n("paypalPct") - n("bankPct"));
        out.textContent = `Precio final Peru: S/ ${penFinal.toFixed(2)}. Precio USD sugerido para recibir neto deseado: USD ${gross.toFixed(2)}. Verificar tarifas PayPal y tarifario BCP vigente.`;
      }
      form.addEventListener("input", calc);
      calc();
    </script>
    <script src="../assets/js/audio-player.js?v=tres-paneles-20260627"></script>
  </body>
